<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="手机也能用的 C 在线练习：写代码、给输入、直接编译运行。">
<title>C 在线练习</title>
<style>
  :root{
    --fg:#1a1a1a; --bg:#fff; --muted:#666; --line:#e6e6e6;
    --card:#fafafa; --accent:#2f6df6; --accent-fg:#fff;
    --pre:#f4f5f7; --ok:#15803d; --bad:#b91c1c; --warn:#a16207;
    --code-bg:#f7f7f9; --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --fg:#e8e8e8; --bg:#111315; --muted:#9aa0a6; --line:#2a2e33;
      --card:#181b1e; --accent:#7aa2ff; --accent-fg:#0b1220;
      --pre:#1b1e21; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
      --code-bg:#14171a;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.55; -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:820px;margin:0 auto;padding:14px 14px 40px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px}
  header.top h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px}
  header.top .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .kn{font-size:13px;color:var(--muted);white-space:nowrap}
  .kn a{margin-left:10px}
  section{margin-top:14px}
  .label{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin:0 0 6px}
  .label b{color:var(--fg);font-weight:600;font-size:13px}
  .editor-box{
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--code-bg);
  }
  #code{
    width:100%;min-height:44vh;resize:vertical;border:0;outline:none;
    background:transparent;color:var(--fg);
    font:13.5px/1.6 "SF Mono",Consolas,"Cascadia Code",Menlo,monospace;
    padding:12px;tab-size:4;white-space:pre;overflow:auto;
  }
  .CodeMirror{height:auto;font:13.5px/1.6 "SF Mono",Consolas,"Cascadia Code",Menlo,monospace}
  .CodeMirror-scroll{min-height:44vh}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  button{
    font:inherit;font-size:14px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--fg);cursor:pointer;min-height:40px;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
  button:active{transform:translateY(1px)}
  button[disabled]{opacity:.55;cursor:default}
  .status{font-size:12px;color:var(--muted);margin-left:auto}
  .status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
  .stdin-box{display:none}
  .stdin-box.show{display:block}
  #stdin{
    width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:10px;
    background:var(--code-bg);color:var(--fg);padding:9px 10px;
    font:13px/1.5 "SF Mono",Consolas,Menlo,monospace;outline:none;
  }
  #out{
    margin:0;padding:12px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--pre);min-height:76px;max-height:46vh;overflow:auto;
    font:13px/1.5 "SF Mono",Consolas,Menlo,monospace;white-space:pre-wrap;word-break:break-word;
  }
  #out:empty::before{content:"运行后这里显示输出";color:var(--muted)}
  .out-label{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px;font-size:13px;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
  .hint code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px}
  @media (max-width:420px){
    header.top h1{font-size:17px}
    .kn{font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>C 在线练习</h1>
      <div class="sub">手机也能写 · 直接编译运行</div>
    </div>
    <div class="kn">
      <a href="/">主页</a>
      <a href="hw.html">作业计划</a>
    </div>
  </header>

  <section>
    <div class="label"><b>代码</b><span id="saved">自动保存</span></div>
    <div class="editor-box">
      <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" wrap="off"></textarea>
    </div>
    <div class="tools">
      <button id="run" class="primary">运行</button>
      <button id="stdinBtn">输入</button>
      <button id="clear">清空</button>
      <button id="copy">复制</button>
      <span id="status" class="status"></span>
    </div>
    <div id="stdinBox" class="stdin-box" style="margin-top:10px">
      <div class="label"><b>程序输入</b><span>scanf 读的内容，一行一个</span></div>
      <textarea id="stdin" spellcheck="false" placeholder="比如：&#10;21"></textarea>
    </div>
  </section>

  <section>
    <div class="out-label"><span><b>输出</b></span><span id="meta"></span></div>
    <pre id="out"></pre>
  </section>

  <p class="hint">
    编译走公开的 Wandbox 服务（gcc 13），第一次运行要等 1~3 秒。<br>
    网络不通或者它挂了，就把代码复制出去用 <a href="https://www.onlinegdb.com/online_c_compiler" target="_blank" rel="noopener">OnlineGDB</a> 跑。<br>
    代码存在这台手机的浏览器里，关掉再打开还在。
  </p>

</div>

<script>
(function(){
  var DEFAULT_CODE = [
    '#include <stdio.h>',
    '',
    'int main(void) {',
    '    int n;',
    '    if (scanf("%d", &n) != 1) n = 0;',
    '    printf("hello %d\\n", n * 2);',
    '    return 0;',
    '}',
    ''
  ].join('\n');

  var STORE_KEY = 'jcyyy.c.code.v1';
  var STDIN_KEY = 'jcyyy.c.stdin.v1';

  var $code = document.getElementById('code');
  var $stdin = document.getElementById('stdin');
  var $stdinBox = document.getElementById('stdinBox');
  var $out = document.getElementById('out');
  var $status = document.getElementById('status');
  var $meta = document.getElementById('meta');
  var $saved = document.getElementById('saved');
  var runBtn = document.getElementById('run');
  var editor = null;

  function getCode(){ return editor ? editor.getValue() : $code.value; }

  function loadStored(){
    try {
      var c = localStorage.getItem(STORE_KEY);
      var s = localStorage.getItem(STDIN_KEY);
      $code.value = (c === null || c === '') ? DEFAULT_CODE : c;
      if (s) $stdin.value = s;
    } catch(e) { $code.value = DEFAULT_CODE; }
  }

  var saveTimer = null;
  function scheduleSave(){
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try {
        localStorage.setItem(STORE_KEY, getCode());
        localStorage.setItem(STDIN_KEY, $stdin.value);
        $saved.textContent = '已保存';
        setTimeout(function(){ $saved.textContent = '自动保存'; }, 1200);
      } catch(e) {}
    }, 400);
  }

  function setStatus(text, cls){
    $status.textContent = text || '';
    $status.className = 'status' + (cls ? ' ' + cls : '');
  }

  function showOutput(text, meta){
    $out.textContent = text;
    $meta.textContent = meta || '';
    if (!text) $out.textContent = '（没有输出）';
  }

  // 有 CodeMirror 就用它，没有就退回普通 textarea
  function initCodeMirror(){
    if (!window.CodeMirror) return;
    editor = CodeMirror.fromTextArea($code, {
      mode: 'text/x-csrc',
      lineNumbers: true,
      lineWrapping: true,
      indentUnit: 4,
      tabSize: 4,
      viewportMargin: 20
    });
    editor.on('change', scheduleSave);
    editor.setSize(null, null);
  }

  function runProgram(){
    var code = getCode();
    if (!code.trim()) { setStatus('代码是空的', 'bad'); return; }

    runBtn.disabled = true;
    setStatus('运行中…');
    $meta.textContent = '';
    var t0 = Date.now();

    var payload = {
      compiler: 'gcc-13.2.0',
      code: code,
      stdin: $stdin.value || '',
      options: 'warning,c11',
      'compiler-option-raw': '-O0'
    };

    fetch('https://wandbox.org/api/compile.json', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data){
      var ms = Date.now() - t0;
      var okRun = String(data.status) === '0';
      var cerr = (data.compiler_error || '').toString();
      var cout = (data.compiler_message || '').toString();
      var pout = (data.program_output || '').toString();
      var perr = (data.program_error || '').toString();

      if (!okRun) {
        showOutput(cerr || cout || perr || '（编译失败，没有详细信息）', '编译失败 · ' + ms + 'ms');
        setStatus('编译失败', 'bad');
        return;
      }
      if (cerr) {
        showOutput(cerr + '\n--- 运行输出 ---\n' + pout, '有警告 · ' + ms + 'ms');
        setStatus('通过（有警告）', 'ok');
        return;
      }
      showOutput(pout, '完成 · ' + ms + 'ms');
      setStatus('完成', 'ok');
    }).catch(function(err){
      setStatus('运行失败', 'bad');
      showOutput('连不上编译服务：' + (err && err.message ? err.message : err) +
        '\n\n网络好的时候再点一次；或者复制代码去 OnlineGDB 跑。', '网络/服务问题');
    }).then(function(){
      runBtn.disabled = false;
    });
  }

  document.getElementById('run').addEventListener('click', runProgram);
  document.getElementById('stdinBtn').addEventListener('click', function(){
    $stdinBox.classList.toggle('show');
    if ($stdinBox.classList.contains('show')) $stdin.focus();
  });
  document.getElementById('clear').addEventListener('click', function(){
    if (!confirm('清空代码？')) return;
    if (editor) editor.setValue(''); else $code.value = '';
    $out.textContent = '';
    $meta.textContent = '';
    setStatus('');
    scheduleSave();
  });
  document.getElementById('copy').addEventListener('click', function(){
    var text = getCode();
    if (!text) return;
    navigator.clipboard.writeText(text).then(function(){
      setStatus('已复制', 'ok');
    }).catch(function(){
      var r = document.createRange(); r.selectNodeContents($code);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      document.execCommand('copy');
      setStatus('已复制', 'ok');
    });
  });
  $stdin.addEventListener('input', scheduleSave);
  $code.addEventListener('input', scheduleSave);

  loadStored();
  initCodeMirror();
})();
</script>
</body>
</html>
